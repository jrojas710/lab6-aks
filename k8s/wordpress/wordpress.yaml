apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: wordpress-html, namespace: wordpress}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wordpress, namespace: wordpress, labels: {app: wordpress, portal: wordpress}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: wordpress}}
  template:
    metadata: {labels: {app: wordpress, portal: wordpress}}
    spec:
      initContainers:
        - name: espera-bd
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo esperando mysql; sleep 3; done"]
      containers:
        - name: wordpress
          image: wordpress:6.6-apache
          env:
            - {name: WORDPRESS_DB_HOST, value: mysql}        # Service de SU namespace
            - {name: WORDPRESS_DB_NAME, value: wordpress}
            - {name: WORDPRESS_DB_USER, value: wordpress}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: wp-db, key: password}}
          ports: [{containerPort: 80}]
          readinessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 10, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: html, mountPath: /var/www/html, subPath: html}
      volumes:
        - name: html
          persistentVolumeClaim: {claimName: wordpress-html}
---
apiVersion: v1
kind: Service
metadata: {name: wordpress, namespace: wordpress}
spec:
  type: LoadBalancer
  selector: {app: wordpress}
  ports: [{port: 80, targetPort: 80}]
